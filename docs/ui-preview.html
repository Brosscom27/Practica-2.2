<!doctype html>
<html>

<head>
    <meta charset='utf-8'>
    <style>
        body {
            font-family: Arial;
            background: #f6f8fc;
            margin: 0
        }

        aside {
            width: 240px;
            background: #fff;
            position: fixed;
            top: 0;
            bottom: 0;
            padding: 20px;
            box-shadow: 0 0 12px #ddd
        }

        main {
            margin-left: 260px;
            padding: 24px
        }

        .card {
            background: #fff;
            padding: 16px;
            border-radius: 10px;
            display: inline-block;
            min-width: 220px;
            margin-right: 12px
        }

        .alert {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            color: #7c5b00
        }
    </style>
</head>

<body>
    <aside>
        <h2>Inventario</h2>
        <p>Dashboard</p>
        <p>Almacenes</p>
        <p>Productos</p>
        <p>Reportes</p>
    </aside>
    <main>
        <h1>Dashboard</h1>
        <div class='card'>
            <h3>Productos totales</h3>
            <p style='font-size:32px'>128</p>
        </div>
        <div class='card'>
            <h3>Bajo stock</h3>
            <p style='font-size:32px'>7</p>
        </div>
        <div class='alert'>Tequila está en stock mínimo (3)</div>
    </main>
</body>

</html>
